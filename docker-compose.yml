version: "3.8"
services:
  postgres:
    image: postgres:16-alpine
    container_name: medusa-postgres
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - medusa-network
  redis:
    image: redis:7-alpine
    container_name: medusa-redis
    ports:
      - "6379:6379"
    networks:
      - medusa-network
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: medusa-backend
    depends_on:
      - postgres
      - redis
    env_file:
      - .env
    ports:
      - "9000:9000"
    networks:
      - medusa-network
  storefront:
    build:
      context: ./apps/storefront
      dockerfile: Dockerfile
    container_name: medusa-storefront
    depends_on:
      - backend
    env_file:
      - .env
    ports:
      - "3000:3000"
    networks:
      - medusa-network
volumes:
  postgres_data:
networks:
  medusa-network:
    driver: bridge